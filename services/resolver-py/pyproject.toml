[project]
name = "resolver-py"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sanaur Asif", email = "sanaurasif2@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "base58>=2.1.1",
    "eth-account>=0.14.0",
    "fastapi>=0.162.4",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "pynacl>=1.6.2",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "uvicorn>=0.54.0",
]

[project.scripts]
resolver-py = "resolver_py:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

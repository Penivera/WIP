name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Install binaryen (wasm-opt) & wasm-strip
        run: |
          sudo apt-get update
          sudo apt-get install -y wabt binaryen

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy check (wasm target)
        run: cargo clippy --target wasm32-unknown-unknown -p unam-registry -- -D warnings

      - name: Unit and integration tests
        run: cargo test --workspace

      - name: Build contract wasm artifact
        run: sh scripts/build-contract.sh

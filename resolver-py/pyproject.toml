[project]
name = "resolver-py"
version = "0.1.0"
description = "Universal Name backend resolver and intent router"
readme = "README.md"
license = "GPL-2.0-only"
authors = [
    { name = "Sanaur Asif", email = "sanaurasif2@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "base58>=2.1.1",
    "eth-account>=0.14.0",
    "fastapi==0.162.5",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "pynacl>=1.6.2",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
